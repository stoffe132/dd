<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake — enkel</title>
  <style>
    :root{
      --bg:#0b1220;
      --grid:#0f1724;
      --snake:#7fe3a7;
      --food:#ff6b6b;
      --ui:#cbd5e1;
    }
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;color:var(--ui);background:var(--bg);display:flex;align-items:center;justify-content:center}
    .wrap{width:min(720px,95vw);max-width:900px;text-align:center}
    h1{margin:6px 0 12px;font-size:20px}
    canvas{background:linear-gradient(180deg, var(--grid), #071021);display:block;margin:0 auto;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.6)}
    .info{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--ui);gap:10px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,.08);padding:8px 12px;border-radius:8px;color:var(--ui);cursor:pointer}
    .controls{display:flex;gap:8px;justify-content:center;margin-top:10px}
    /* enkla touch-knappar */
    .touch {display:none;gap:6px;margin-top:10px;justify-content:center}
    .touch button{width:56px;height:56px;border-radius:10px;font-size:18px}
    @media (max-width:600px){ .touch{display:flex} .controls{display:none} }
    .small{font-size:13px;color:#9fb0c8}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Snake — enkel</h1>
    <div class="info">
      <div>Poäng: <span id="score">0</span></div>
      <div class="small">Tryck p för paus · R för nytt spel</div>
      <div><button id="restart" class="btn">Nytt spel</button></div>
    </div>
    <canvas id="game" width="720" height="720"></canvas>

    <div class="controls" aria-hidden="true">
      <button id="up" class="btn">↑</button>
      <button id="left" class="btn">←</button>
      <button id="right" class="btn">→</button>
      <button id="down" class="btn">↓</button>
    </div>

    <div class="touch" aria-hidden="false">
      <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
        <button id="t-up" class="btn">↑</button>
        <div style="display:flex;gap:6px">
          <button id="t-left" class="btn">←</button>
          <button id="t-down" class="btn">↓</button>
          <button id="t-right" class="btn">→</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  // Enkel Snake. Anpassa gridSize för svårighet.
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const restartBtn = document.getElementById('restart');

  const gridSize = 20; // antal celler per rad
  const tile = canvas.width / gridSize; // pixel per cell
  const baseSpeed = 120; // ms per spelsteg (lägre = snabbare)

  let snake, dir, food, score, running, lastTick;

  function startGame(){
    snake = [{x: Math.floor(gridSize/2), y: Math.floor(gridSize/2)}];
    dir = {x:1,y:0}; // start höger
    placeFood();
    score = 0;
    running = true;
    lastTick = performance.now();
    scoreEl.textContent = score;
    requestAnimationFrame(loop);
  }

  function placeFood(){
    let free;
    do {
      free = {x: Math.floor(Math.random()*gridSize), y: Math.floor(Math.random()*gridSize)};
      // se till att mat inte hamnar i ormen
    } while (snake.some(s => s.x===free.x && s.y===free.y));
    food = free;
  }

  function loop(ts){
    if(!running) return draw(); // visa sista bild
    const elapsed = ts - lastTick;
    if(elapsed >= baseSpeed){
      lastTick = ts - (elapsed % baseSpeed);
      step();
    }
    draw();
    requestAnimationFrame(loop);
  }

  function step(){
    // ny huvudposition
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // väggkrock -> wrap-around
    if (head.x < 0) head.x = gridSize - 1;
    if (head.x >= gridSize) head.x = 0;
    if (head.y < 0) head.y = gridSize - 1;
    if (head.y >= gridSize) head.y = 0;

    // självkrock
    if (snake.some(s => s.x===head.x && s.y===head.y)){
      running = false;
      return;
    }

    snake.unshift(head);

    // äta mat?
    if(head.x === food.x && head.y === food.y){
      score++;
      scoreEl.textContent = score;
      placeFood();
      // öka hastighet lite vid varje 5-poäng
      if (score % 5 === 0 && baseSpeed > 40) {
        // notera: baseSpeed är konstant i denna enkla version. 
        // Vill du dynamisk hastighet, gör baseSpeed till variabel och ändra här.
      }
    } else {
      snake.pop();
    }
  }

  function draw(){
    // bakgrund
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // rityta rutnät (subtilt)
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    for(let i=0;i<=gridSize;i++){
      const x = i*tile;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
      const y = i*tile;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
    }

    // mat
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food').trim();
    roundRect(ctx, food.x*tile+2, food.y*tile+2, tile-4, tile-4, 6, true);

    // orm
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--snake').trim();
    for(let i=0;i<snake.length;i++){
      const s = snake[i];
      const pad = (i===0) ? 2 : 4;
      roundRect(ctx, s.x*tile+pad, s.y*tile+pad, tile-2*pad, tile-2*pad, 6, true);
    }

    // game over text
    if(!running){
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, canvas.height/2 - 50, canvas.width, 100);
      ctx.fillStyle = '#fff';
      ctx.font = '24px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 6);
      ctx.font = '14px system-ui';
      ctx.fillText('Tryck R för nytt spel', canvas.width/2, canvas.height/2 + 20);
    }
  }

  // enklare avrundad rektangel
  function roundRect(ctx, x, y, w, h, r, fill){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if(fill) ctx.fill();
    else ctx.stroke();
  }

  // tangenter
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if(k === 'arrowup' || k === 'w') setDir(0,-1);
    if(k === 'arrowdown' || k === 's') setDir(0,1);
    if(k === 'arrowleft' || k === 'a') setDir(-1,0);
    if(k === 'arrowright' || k === 'd') setDir(1,0);
    if(k === 'p') running = !running; // paus
    if(k === 'r') startGame();
  });

  function setDir(x,y){
    // hindra att vända 180 grader direkt
    if(snake.length>1 && snake[0].x + x === snake[1].x && snake[0].y + y === snake[1].y) return;
    dir = {x,y};
  }

  // knappar (desktop)
  ['up','down','left','right'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('click', ()=> {
      if(id==='up') setDir(0,-1);
      if(id==='down') setDir(0,1);
      if(id==='left') setDir(-1,0);
      if(id==='right') setDir(1,0);
    });
  });

  // touch-knappar (mobil)
  ['t-up','t-down','t-left','t-right'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('touchstart', (e)=>{ e.preventDefault(); const map = { 't-up':[0,-1],'t-down':[0,1],'t-left':[-1,0],'t-right':[1,0] }; const d = map[id]; setDir(d[0],d[1]); });
  });

  restartBtn.addEventListener('click', startGame);

  // init
  startGame();

  // gör canvas responsiv (behåll kvadrat)
  function resizeCanvas(){
    const max = Math.min(window.innerWidth*0.92, window.innerHeight*0.74);
    const size = Math.max(320, Math.min(720, Math.floor(max/20)*20 ));
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  </script>
</body>
</html>
